version: '3.8'

services:
  app:
    build: .
    container_name: blog_app_server
    ports:
      - "8080:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - blog_network

  db:
    image: mysql:8.0
    container_name: blog_mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: blog_db
    ports:
      - "3306:3306"
    volumes:
      - blog_db_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blog_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: blog_phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword
    depends_on:
      - db
    networks:
      - blog_network

networks:
  blog_network:

volumes:
  blog_db_data: